name: Package theme

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (para minificação via npx)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build ZIP package (com CSS/JS minificados)
        run: |
          set -euo pipefail
          bash scripts/package-theme.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: feicoop-wp-template-${{ github.sha }}
          path: dist/feicoop-wp-template.zip
          if-no-files-found: error

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/feicoop-wp-template.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
