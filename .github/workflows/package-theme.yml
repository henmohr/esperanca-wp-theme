name: Package theme

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (para minificação via npx)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lê a versão do tema (style.css)
        id: version
        run: |
          VER="$(grep -m1 '^Version:' style.css | awk '{print $2}' | tr -d '\r')"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"
          echo "Versão detectada: ${VER}"

      - name: Build ZIP package (com CSS/JS minificados)
        run: |
          set -euo pipefail
          bash scripts/package-theme.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: feicoop-wp-template-${{ github.sha }}
          path: dist/feicoop-wp-template.zip
          if-no-files-found: error

      - name: Publish release (automática na main ou via tag v*)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Na main usa a versão do style.css; em tags v* usa o próprio nome da tag.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.ver) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('FEICOOP v{0}', steps.version.outputs.ver) }}
          body: |
            ZIP do tema pronto para instalar em **Aparência > Temas > Adicionar novo > Enviar tema**.

            Gerado automaticamente pelo workflow **Package theme**.
          files: dist/feicoop-wp-template.zip
          # Atualiza a release da mesma tag se já existir (novo push sem bump de versão).
          update_existing: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
